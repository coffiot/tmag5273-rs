[package]
name = "tmag5273"
version = "3.6.9"
edition = "2024"
rust-version = "1.94"
authors = ["CofIoT <dev@coffiot.io>"]
description = "Platform-agnostic no_std driver for the TI TMAG5273 3-axis Hall-effect sensor"
documentation = "https://docs.rs/tmag5273"
repository = "https://github.com/coffiot/tmag5273"
license = "MIT OR Apache-2.0"
keywords = ["embedded-hal", "sensor", "hall-effect", "no-std", "driver"]
categories = ["embedded", "hardware-support", "no-std::no-alloc"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
embedded-hal = "1.0"
defmt = { version = "1.0", optional = true }
libm = { version = "0.2", optional = true }
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
embedded-hal-mock = { version = "0.11", default-features = false, features = [
    "eh1",
] }

[features]
default = []
crc = [] # CRC-8 validation on I2C reads
defmt = ["dep:defmt"] # defmt::Format derives on all public types
libm = [
    "dep:libm",
] # Use libm for sqrt/math instead of fast-inverse-sqrt approximation

[lib]
name = "tmag5273"
path = "src/lib.rs"

[lints.clippy]
collapsible_if = "allow"
